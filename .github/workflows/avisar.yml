name: Avisar jogos grátis da Epic

on:
  schedule:
    # O GitHub usa horário UTC. Brasília = UTC-3.
    - cron: "7 12 * * *"   # 09:07 em Brasília
    - cron: "7 0 * * *"    # 21:07 em Brasília
  workflow_dispatch:        # permite rodar manualmente pelo botão "Run workflow"

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Enviar aviso para o Telegram
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
